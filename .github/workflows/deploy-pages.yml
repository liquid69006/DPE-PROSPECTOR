name: 🚀 Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Pages
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # Auto-update PWA : version.json + APP_VERSION dans index.html = SHA court.
      # Echec du build si le placeholder est introuvable (front sans version).
      - name: 🏷 Version
        run: |
          V="${GITHUB_SHA::7}"
          printf '{"v":"%s"}' "$V" > version.json
          sed -i "s/const APP_VERSION = '__APP_VERSION__';/const APP_VERSION = '$V';/" index.html
          test "$(grep -c "const APP_VERSION = '$V';" index.html)" = 1

      - name: 🚀 Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy . --project-name=dpe-prospector --commit-dirty=true
