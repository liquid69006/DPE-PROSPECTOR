name: 🗺️ Générer carte A0

on:
  workflow_dispatch:
    inputs:
      repartition_json:
        description: 'JSON répartition secteurs'
        required: true
        type: string
      agence_id:
        description: 'ID agence'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🌐 Google Chrome
        # Le snap chromium-browser livré par défaut sur ubuntu-latest
        # (Ubuntu 24.04) casse en headless ("DevToolsActivePort file
        # doesn't exist"). On installe le paquet .deb officiel Google
        # Chrome qui fonctionne bien en CI.
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: 🔧 ChromeDriver
        # chromium-driver depuis le repo Ubuntu : son chromedriver est
        # compatible avec n'importe quelle version recente de Chrome
        # (Selenium 4.x utilise le protocole CDP, retrocompatible).
        run: |
          sudo apt-get install -y chromium-driver
          chromedriver --version

      - name: 📦 Dépendances
        run: pip install folium pillow requests selenium

      - name: 🗺️ Générer carte A0
        run: python scripts/generate_map_a0.py
        env:
          REPARTITION_JSON: ${{ inputs.repartition_json }}
          AGENCE_ID: ${{ inputs.agence_id }}

      - name: 📥 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carte-a0-${{ inputs.agence_id }}
          path: output/carte_a0.png
          retention-days: 7
